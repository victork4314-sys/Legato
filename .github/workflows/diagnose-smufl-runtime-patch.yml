name: Diagnose final SMuFL runtime patch
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-smufl-runtime-patch.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smufl-semantic-audit-corrections
      - name: Apply corrected catalog
        run: python3 tools/correct_smufl_semantics_v5.py
      - name: Capture runtime patch result
        run: |
          set +e
          python3 tools/apply_semantic_playback_corrections_v5.py > tools/final-runtime-patch.txt 2>&1
          CODE=$?
          cat tools/final-runtime-patch.txt
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/final-runtime-patch.txt
            git commit -m "Capture final semantic runtime patch failure" || true
            git push origin HEAD:fix/smufl-semantic-audit-corrections
          fi
          exit "$CODE"

name: Build pinned on-device voice engine

on:
  push:
    branches:
      - agent/real-continuous-voice-control
    paths:
      - whisper-build.lock
      - .github/workflows/build-whisper-wasm.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-command-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/real-continuous-voice-control

      - name: Read pinned versions
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          source whisper-build.lock
          echo "whisper_cpp_tag=${whisper_cpp_tag}" >> "$GITHUB_OUTPUT"
          echo "emscripten_version=${emscripten_version}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Emscripten
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "${{ steps.pins.outputs.emscripten_version }}"
          /tmp/emsdk/emsdk activate "${{ steps.pins.outputs.emscripten_version }}"

      - name: Fetch pinned whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.pins.outputs.whisper_cpp_tag }}" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          git -C /tmp/whisper.cpp rev-parse HEAD > /tmp/whisper-commit.txt

      - name: Build browser command engine
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          emcmake cmake -S /tmp/whisper.cpp -B /tmp/whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_WASM_SINGLE_FILE=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/whisper-build --target libcommand --parallel 2

      - name: Collect and verify generated engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/whisper-command
          mkdir -p vendor/whisper-command

          test -f /tmp/whisper-build/bin/command.wasm/command.js
          test -f /tmp/whisper-build/bin/command.wasm/helpers.js
          test -f /tmp/whisper-build/bin/command.wasm/coi-serviceworker.js

          cp /tmp/whisper-build/bin/command.wasm/command.js vendor/whisper-command/command.js
          cp /tmp/whisper-build/bin/command.wasm/helpers.js vendor/whisper-command/helpers.js
          cp /tmp/whisper-build/bin/command.wasm/coi-serviceworker.js coi-serviceworker.js

          if test -f /tmp/whisper-build/bin/libcommand.worker.js; then
            cp /tmp/whisper-build/bin/libcommand.worker.js vendor/whisper-command/libcommand.worker.js
          fi

          node --check vendor/whisper-command/command.js
          node --check vendor/whisper-command/helpers.js
          node --check coi-serviceworker.js
          grep -q "get_transcribed" vendor/whisper-command/command.js
          grep -q "set_audio" vendor/whisper-command/command.js
          grep -q "FS_createDataFile" vendor/whisper-command/command.js

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          commit = Path('/tmp/whisper-commit.txt').read_text().strip()
          files = {}
          for path in sorted(Path('vendor/whisper-command').glob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  files[str(path)] = {
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  }
          sw = Path('coi-serviceworker.js').read_bytes()
          files['coi-serviceworker.js'] = {
              'bytes': len(sw),
              'sha256': hashlib.sha256(sw).hexdigest(),
          }
          Path('vendor/whisper-command/build.json').write_text(
              json.dumps({
                  'whisperCppTag': '${{ steps.pins.outputs.whisper_cpp_tag }}',
                  'whisperCppCommit': commit,
                  'emscripten': '${{ steps.pins.outputs.emscripten_version }}',
                  'singleFileWasm': True,
                  'files': files,
              }, indent=2) + '\n'
          )
          PY

      - name: Commit generated engine to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/whisper-command coi-serviceworker.js; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whisper-command coi-serviceworker.js
          git commit -m "Build pinned on-device whisper command engine"
          git push origin HEAD:agent/real-continuous-voice-control

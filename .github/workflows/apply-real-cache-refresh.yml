name: Apply real cache refresh
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - cache-refresh.js
      - _headers
      - tools/apply-real-cache-refresh.py
      - .github/workflows/apply-real-cache-refresh.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-cache-refresh
      - name: Apply guarded index wiring
        run: python3 tools/apply-real-cache-refresh.py
      - name: Check watcher syntax
        run: node --check cache-refresh.js
      - name: Verify exact cache markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          i = Path('index.html').read_text(encoding='utf-8')
          h = Path('_headers').read_text(encoding='utf-8')
          w = Path('cache-refresh.js').read_text(encoding='utf-8')
          for marker in [
              '20260727-real-cache-refresh-1',
              'cache-refresh.js?v=20260727-real-cache-refresh-1',
              "fetch(probe.href",
              "location.replace(target.href)",
              'CDN-Cache-Control: no-store',
              'Cloudflare-CDN-Cache-Control: no-store'
          ]:
              if marker not in i + h + w:
                  raise SystemExit('Missing marker: ' + marker)
          if i.count('cache-refresh.js?v=') != 1:
              raise SystemExit('Watcher must be loaded once')
          print('Cache refresh checks passed')
          PY
      - name: Commit wired index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire automatic Legato build refresh"
          git push origin HEAD:fix/real-cache-refresh

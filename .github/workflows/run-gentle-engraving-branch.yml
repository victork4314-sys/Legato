name: Run gentle engraving branch repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-safety-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gentle-engraving-and-direct-editing
          fetch-depth: 0

      - name: Patch requested engraving and editing areas
        run: python3 .github/scripts/gentle_engraving_patch.py

      - name: Run engraving regression checks
        run: |
          python3 .github/scripts/gentle_engraving_test.py
          node --check /tmp/legato-logic.js

      - name: Commit repaired safety branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Repair engraving and add direct score editing"
          git push origin HEAD:fix/gentle-engraving-and-direct-editing

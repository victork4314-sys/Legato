name: Run gentle engraving branch repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-safety-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gentle-engraving-and-direct-editing
          fetch-depth: 0
          show-progress: false

      - name: Patch requested engraving and editing areas
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > repair-error.txt 2>&1
          import re
          import runpy
          from pathlib import Path
          original_subn = re.subn
          def literal_subn(pattern, replacement, string, count=0, flags=0):
              if isinstance(replacement, str):
                  return original_subn(pattern, lambda _match: replacement, string, count=count, flags=flags)
              return original_subn(pattern, replacement, string, count=count, flags=flags)
          re.subn = literal_subn
          runpy.run_path('.github/scripts/gentle_engraving_patch.py', run_name='__main__')
          path = Path('index.html')
          patched = path.read_text(encoding='utf-8')
          slash = chr(92)
          patched = re.sub(
              r"font-family:'(Inter|Source Serif 4)'",
              lambda match: 'font-family:' + slash + "'" + match.group(1) + slash + "'",
              patched
          )
          path.write_text(patched, encoding='utf-8')
          PY
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat repair-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git restore index.html
            git add repair-error.txt
            git commit -m "Record guarded repair mismatch"
            git push origin HEAD:fix/gentle-engraving-and-direct-editing
            exit "$code"
          fi
          rm -f repair-error.txt

      - name: Run engraving regression checks
        shell: bash
        run: |
          set +e
          {
            python3 .github/scripts/gentle_engraving_test.py
            node --check /tmp/legato-logic.js
          } > test-error.txt 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cat test-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git restore index.html
            git add test-error.txt
            git commit -m "Record engraving regression failure"
            git push origin HEAD:fix/gentle-engraving-and-direct-editing
            exit "$code"
          fi
          rm -f test-error.txt

      - name: Commit repaired safety branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html repair-error.txt test-error.txt
          git diff --cached --check
          git commit -m "Repair engraving and add direct score editing"
          git push origin HEAD:fix/gentle-engraving-and-direct-editing

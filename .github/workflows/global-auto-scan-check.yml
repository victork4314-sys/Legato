name: Global auto scan check

on:
  pull_request:
    paths:
      - .global-auto-scan-trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: python .github/scripts/patch_global_auto_scan.py
      - name: Verify scope and syntax
        run: |
          git diff --check
          git diff --name-only | grep -qx 'index.html'
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script\b[^>]*\bdata-dc-script\b[^>]*>(.*?)</script>', text, re.S)
          if len(matches) != 1: raise SystemExit('script block mismatch')
          Path('/tmp/legato.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/legato.js
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Test continuous all-item scanning
        run: |
          python -m http.server 4173 >/tmp/legato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert = (v, m) => { if (!v) throw new Error(m); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.addInitScript(() => localStorage.setItem('legato.tour.v1', '1'));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => !!window.__legatoOwner, null, { timeout: 30000 });
            const result = await page.evaluate(() => {
              const o = window.__legatoOwner;
              const targets = o.autoScanTargets();
              const modes = [...new Set(targets.filter(t => t.zone === 4).map(t => t.mode))];
              const samples = [];
              o.state.autoScan = true;
              o.state.zone = targets[0].zone; o.state.mode = targets[0].mode; o.state.focus = targets[0].focus;
              for (let i = 0; i < Math.min(targets.length + 2, 180); i++) {
                o.advanceAutoScan();
                const list = o.focusList();
                const item = list[o.state.focus];
                samples.push({ zone:o.state.zone, mode:o.state.mode, focus:o.state.focus, label:item && item.label, ring:o.ring(item && item.t, item && item.i).includes('box-shadow') });
              }
              return { count: targets.length, modes, samples };
            });
            assert(result.count > 40, 'too few scan targets: ' + result.count);
            assert(JSON.stringify(result.modes) === JSON.stringify([0,1,2,3,4,5]), 'not all mode bars scanned: ' + result.modes);
            assert(result.samples.every(x => x.label && x.ring), 'an item lacked label/highlight: ' + JSON.stringify(result.samples.find(x => !x.label || !x.ring)));
            assert(errors.length === 0, 'page errors: ' + errors.join(' | '));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Commit verified patch
        run: |
          git config user.name "Legato maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto scan every item across all bars"
          git push origin HEAD:${{ github.head_ref }}

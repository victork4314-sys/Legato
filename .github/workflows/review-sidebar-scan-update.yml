name: Review sidebar and scan update

on:
  pull_request:
    paths:
      - .legato-sidebar-scan-trigger

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply guarded patch
        run: python .github/scripts/run_sidebar_patch.py
      - name: Verify exact scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only | grep -qx 'index.html'
          git diff -- index.html | grep -q 'HIDE SIDEBARS'
          git diff -- index.html | grep -q 'AUTO SCAN'
          git diff -- index.html | grep -q 'sidebarsHidden'
          git diff -- index.html | grep -q 'cycleVisibleZone'
          ! git diff -- index.html | grep -q '^+.*faceButtons'
      - name: Commit patch to review branch
        shell: bash
        run: |
          git config user.name "Legato maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add sidebar visibility and visible auto scan"
          git push origin HEAD:${{ github.head_ref }}

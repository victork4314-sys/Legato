# Clean verification pass against the already-committed app and catalog
name: Apply complete SMuFL library and playback
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - smufl-catalog.js
      - tools/generate_smufl_catalog.py
      - tools/generate_smufl_catalog_v2.py
      - tools/apply_complete_library.py
      - tools/apply_complete_library_v2.py
      - tools/apply_complete_library_v3.py
      - tools/apply_complete_library_v4.py
      - tools/apply_complete_library_v5.py
      - tools/test_complete_library.mjs
      - .github/workflows/apply-complete-smufl-library.yml
permissions:
  contents: write
jobs:
  generate-repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-smufl-library-playback-selector

      - name: Generate complete official catalog
        run: |
          python3 tools/generate_smufl_catalog_v2.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          raw = Path('smufl-catalog.js').read_text(encoding='utf-8')
          prefix = 'window.LEGATO_SMUFL_CATALOG='
          assert raw.startswith(prefix) and raw.rstrip().endswith(';')
          data = json.loads(raw[len(prefix):].strip()[:-1])
          assert data['glyphCount'] > 2400, data['glyphCount']
          assert data['rangeCount'] > 100, data['rangeCount']
          assert len(data['glyphs']) == data['glyphCount']
          bad = [g for g in data['glyphs'] if not g.get('id') or not g.get('label') or not g.get('range') or not g.get('group') or g.get('placement') not in ('note','event','span','structure') or not g.get('kind') or (g.get('audible') and not g.get('sound'))]
          assert not bad, bad[:3]
          assert sum(1 for g in data['glyphs'] if g.get('tier') == 'specialist') > 100
          assert sum(1 for g in data['glyphs'] if g.get('audible')) > 100
          assert any(g.get('kind') == 'hairpin' and g.get('placement') == 'span' and g.get('audible') for g in data['glyphs'])
          print('Catalog audit passed:', data['glyphCount'], 'glyphs,', data['rangeCount'], 'ranges')
          PY

      - name: Apply guarded application integration
        run: |
          set +e
          if grep -q '20260727-complete-smufl-playback-1' index.html; then
            echo 'Complete library integration already applied' > tools/complete-library-patch.txt
            CODE=0
          else
            python3 tools/apply_complete_library_v5.py > tools/complete-library-patch.txt 2>&1
            CODE=$?
          fi
          echo "$CODE" > tools/complete-library-patch-exit.txt
          cat tools/complete-library-patch.txt
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/complete-library-patch.txt tools/complete-library-patch-exit.txt
            git commit -m "Capture complete-library patch failure" || true
            git push origin HEAD:feature/complete-smufl-library-playback-selector
          fi
          exit "$CODE"

      - name: Check every JavaScript source
        run: |
          node --check smufl-catalog.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', text)
          if not blocks:
              raise SystemExit('No embedded JavaScript found')
          Path('/tmp/legato-complete-library.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/legato-complete-library.js

      - name: Verify complete scope and protected controller paths
        run: |
          set +e
          python3 - <<'PY' > tools/complete-library-scope.txt 2>&1
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          catalog = Path('smufl-catalog.js').read_text(encoding='utf-8')
          required = [
              '20260727-complete-smufl-playback-1',
              '<script src="./smufl-catalog.js?v=20260727-complete-smufl-playback-1"></script>',
              'const CAT = buildCompleteCatalog();',
              'applyCatalogCommand(meta, name, glyph)',
              'scoreSelectableObjects(state)',
              "panel: 'score-object-selector'",
              'selectedChordHead',
              'noteMidi(note, state)',
              'articulationPlayback(note)',
              'techniqueInstrument(staff, pos, note, state)',
              "this.activeScoreSpan(['gliss','portamento']",
              'applyLegacyFallback(cat, name, glyph)',
              "button4: 'previous-zone', button5: 'next-zone'",
              'const BUMPER_COMBO_MS = 120;',
              "case 'previous-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(-1); break; } this.cycleVisibleZone(-1); break;",
              "case 'next-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(1); break; } this.cycleVisibleZone(1); break;"
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit('Missing required marker: ' + marker)
          if 'window.LEGATO_SMUFL_CATALOG=' not in catalog:
              raise SystemExit('Generated catalog is missing')
          forbidden = [
              "const heads = [n.step].concat(n.chord || [] .map",
              "spoken: name + ' applied' });\n  }\n  commitWheel()"
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit('Old or broken path remains: ' + marker)
          print('Complete scope and protected controller paths passed')
          PY
          CODE=$?
          cat tools/complete-library-scope.txt
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/complete-library-scope.txt
            git commit -m "Capture complete-library scope assertion" || true
            git push origin HEAD:feature/complete-smufl-library-playback-selector
          fi
          exit "$CODE"

      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run complete library in Chromium
        run: |
          python3 -m http.server 4173 >/tmp/legato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          set +e
          node tools/test_complete_library.mjs > tools/complete-library-browser.txt 2>&1
          CODE=$?
          cat tools/complete-library-browser.txt
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/complete-library-browser.txt
            git commit -m "Capture complete-library browser assertion" || true
            git push origin HEAD:feature/complete-smufl-library-playback-selector
          fi
          exit "$CODE"

      - name: Commit generated catalog and repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smufl-catalog.js
          git diff --cached --quiet || git commit -m "Add complete SMuFL library, playback semantics and score selector"
          git push origin HEAD:feature/complete-smufl-library-playback-selector

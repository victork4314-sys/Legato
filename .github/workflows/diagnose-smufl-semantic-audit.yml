name: Diagnose SMuFL semantic audit
on:
  pull_request:
    branches: [main]
    paths:
      - tools/audit_corrected_catalog.py
      - .github/workflows/diagnose-smufl-semantic-audit.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smufl-semantic-audit-corrections
      - name: Apply catalog correction
        run: python3 tools/correct_smufl_semantics_v3.py
      - name: Run named audit and capture result
        run: |
          set +e
          python3 tools/audit_corrected_catalog.py > tools/corrected-catalog-audit.txt 2>&1
          CODE=$?
          cat tools/corrected-catalog-audit.txt
          if [ "$CODE" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/corrected-catalog-audit.txt
            git commit -m "Capture corrected catalog audit failure" || true
            git push origin HEAD:fix/smufl-semantic-audit-corrections
          fi
          exit "$CODE"

name: Diagnose actual electronic SMuFL metadata
on:
  pull_request:
    branches: [main]
    paths:
      - tools/list_corrected_electronic.py
      - tools/correct_smufl_semantics_v4.py
      - .github/workflows/diagnose-smufl-semantic-audit.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/smufl-semantic-audit-corrections
      - name: Apply expanded catalog correction
        run: python3 tools/correct_smufl_semantics_v4.py
      - name: Record actual electronic metadata
        run: |
          python3 tools/list_corrected_electronic.py > tools/corrected-electronic-metadata.txt
          cat tools/corrected-electronic-metadata.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/corrected-electronic-metadata.txt
          git commit -m "Record actual electronic SMuFL metadata" || true
          git push origin HEAD:fix/smufl-semantic-audit-corrections

name: Apply interaction repair
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tools/apply-interaction-fix.py
      - tools/prepare-patch-script.py
      - .github/workflows/inspect-interaction-fix.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rests-ties-score-focus-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct duplicated font guard
        run: python3 tools/prepare-patch-script.py
      - name: Apply guarded repair and capture result
        run: |
          set +e
          python3 tools/apply-interaction-fix.py > tools/patch-run.txt 2>&1
          code=$?
          cat tools/patch-run.txt
          echo "$code" > tools/patch-exit.txt
          exit 0
      - name: Commit exact diagnostic or repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/patch-run.txt tools/patch-exit.txt
          git diff --cached --quiet || git commit -m "Capture guarded interaction repair result"
          git push origin HEAD:fix/rests-ties-score-focus-fonts
      - name: Stop when guard rejected
        run: test "$(cat tools/patch-exit.txt)" = "0"
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>', text)
          if not blocks: raise SystemExit('No embedded script found')
          Path('/tmp/legato-embedded.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/legato-embedded.js
      - name: Run exact regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=['20260727-rests-ties-focus-fonts-1','data-score-editor-shell="true"','Tie completed from point one to point two','FONT_PACKS',"timeTopStyle: 'position:absolute;left:' + timeX + 'px;top:0", "style: glyphAt(noteX(r.p) - 7, y, 48, 'rgba(27,26,23,.42)') + 'pointer-events:none;'", "case 'previous-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(-1); break; } this.cycleVisibleZone(-1); break;", "case 'next-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(1); break; } this.cycleVisibleZone(1); break;", "button4: 'previous-zone', button5: 'next-zone'"]
          for x in required:
            if x not in t: raise SystemExit('Missing regression marker: '+x)
          for x in ['rests inserted','Note deleted — rest inserted']:
            if x in t: raise SystemExit('Old fake-rest behavior remains: '+x)
          print('Static regression guards passed')
          PY

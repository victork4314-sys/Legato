name: Inspect interaction repair
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tools/inspect-interaction-fix.sh
      - .github/workflows/inspect-interaction-fix.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rests-ties-score-focus-fonts
      - name: Write exact repair target map
        run: bash tools/inspect-interaction-fix.sh > tools/interaction-line-map.txt
      - name: Commit line map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/interaction-line-map.txt
          git diff --cached --quiet || git commit -m "Record exact interaction repair targets"
          git push origin HEAD:fix/rests-ties-score-focus-fonts

name: Apply interaction repair
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tools/apply-interaction-fix.py
      - .github/workflows/inspect-interaction-fix.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rests-ties-score-focus-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded repair
        run: python3 tools/apply-interaction-fix.py
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>', text)
          if not blocks: raise SystemExit('No embedded script found')
          Path('/tmp/legato-embedded.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/legato-embedded.js
      - name: Run exact regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            '20260727-rests-ties-focus-fonts-1',
            'data-score-editor-shell="true"',
            'Tie completed from point one to point two',
            'FONT_PACKS',
            "timeTopStyle: 'position:absolute;left:' + timeX + 'px;top:0",
            "style: glyphAt(noteX(r.p) - 7, y, 48, 'rgba(27,26,23,.42)') + 'pointer-events:none;'",
            "case 'previous-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(-1); break; } this.cycleVisibleZone(-1); break;",
            "case 'next-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(1); break; } this.cycleVisibleZone(1); break;",
            "button4: 'previous-zone', button5: 'next-zone'"
          ]
          for x in required:
            if x not in t: raise SystemExit('Missing regression marker: '+x)
          forbidden=['rests inserted', 'Note deleted — rest inserted']
          for x in forbidden:
            if x in t: raise SystemExit('Old fake-rest behavior remains: '+x)
          if t.count("{ id:'") < 18: raise SystemExit('Expected themes plus font packs')
          print('Static regression guards passed')
          PY
      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix rests ties score focus time placement and fonts"
          git push origin HEAD:fix/rests-ties-score-focus-fonts

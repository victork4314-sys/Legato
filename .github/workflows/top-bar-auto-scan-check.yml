name: Top bar auto scan check

on:
  push:
    branches:
      - fix/top-bar-auto-scan
    paths:
      - .top-bar-scan-trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-bar-auto-scan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: python .github/scripts/patch_top_bar_scan.py
      - name: Verify exact source scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only | grep -qx 'index.html'
          git diff -- index.html | grep -q "Open the file menu"
          git diff -- index.html | grep -q "ring('top', 4)"
      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script\b[^>]*\bdata-dc-script\b[^>]*>(.*?)</script>', text, re.S)
          if len(matches) != 1:
              raise SystemExit(f'expected one data-dc-script block, found {len(matches)}')
          Path('/tmp/legato-logic.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/legato-logic.js
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Test top bar scan
        shell: bash
        run: |
          python -m http.server 4173 >/tmp/legato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert = (v, m) => { if (!v) throw new Error(m); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.addInitScript(() => localStorage.setItem('legato.tour.v1', '1'));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => !!window.__legatoOwner, null, { timeout: 30000 });
            const result = await page.evaluate(() => {
              const owner = window.__legatoOwner;
              owner.setState({ zone: 0, focus: 0 });
              const labels = owner.focusList().map(x => x.label);
              const vals = owner.renderVals();
              return {
                labels,
                pointerRing: vals.ptrChipStyle.includes('box-shadow'),
                sidebarRing: (() => { owner.state.focus = 1; return owner.renderVals().sidebarsToggleStyle.includes('box-shadow'); })(),
                scanRing: (() => { owner.state.focus = 2; return owner.renderVals().autoScanToggleStyle.includes('box-shadow'); })(),
                menuRing: (() => { owner.state.focus = 3; return owner.renderVals().modeBadgeStyle.includes('box-shadow'); })(),
                fileRing: (() => { owner.state.focus = 4; return owner.renderVals().fileMenuStyle.includes('box-shadow'); })()
              };
            });
            const expected = ['Turn pointer on', 'Hide sidebars', 'Start auto scan', 'Open the menu', 'Open the file menu'];
            assert(JSON.stringify(result.labels.slice(0, 5)) === JSON.stringify(expected), 'top bar controls are not first in scan: ' + result.labels.join(' | '));
            assert(result.pointerRing && result.sidebarRing && result.scanRing && result.menuRing && result.fileRing, 'one or more top bar controls lack a scan ring');
            assert(errors.length === 0, 'page errors: ' + errors.join(' | '));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Legato maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Include full top bar in auto scan"
          git push origin HEAD:fix/top-bar-auto-scan

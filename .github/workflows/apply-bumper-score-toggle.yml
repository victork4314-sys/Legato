name: Apply bumper score toggle
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - tools/apply-bumper-score-toggle.py
      - tools/test-bumper-score-toggle.mjs
      - .github/workflows/apply-bumper-score-toggle.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bumper-score-toggle
      - name: Apply guarded patch
        run: python3 tools/apply-bumper-score-toggle.py
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', text)
          if not blocks:
              raise SystemExit('No embedded JavaScript found')
          Path('/tmp/legato-bumper-toggle.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/legato-bumper-toggle.js
      - name: Verify protected bumper behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('index.html').read_text(encoding='utf-8')
          required = [
            '20260727-bumper-score-toggle-1',
            'const BUMPER_COMBO_MS = 120;',
            "button4: 'previous-zone', button5: 'next-zone'",
            "case 'previous-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(-1); break; } this.cycleVisibleZone(-1); break;",
            "case 'next-zone': if (s.zone === 3 && s.selId) { this.nudgeAccidental(1); break; } this.cycleVisibleZone(1); break;",
            'if (i === 4 || i === 5) continue;',
            "returnToScoreHint: s.zone === 3 ? 'A LEAVE' : 'A ENTER'",
            'setTimeout(() => this.setState({ scoreHint: false }), 1500)'
          ]
          for marker in required:
              if marker not in t:
                  raise SystemExit('Missing marker: ' + marker)
          print('Bumper combo and individual bumper guards passed')
          PY
      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare isolated browser interaction test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test-bumper-score-toggle.mjs')
          t = p.read_text(encoding='utf-8')
          fade = "assert.equal(await page.evaluate(() => window.__legatoOwner.state.scoreHint), false, 'entry hint should fade');"
          fade_replacement = fade + "\nawait page.evaluate(() => window.__legatoOwner.setState({ tour: false }));\nawait page.waitForTimeout(80);"
          if fade not in t:
              raise SystemExit('Could not find score hint assertion in browser test')
          t = t.replace(fade, fade_replacement, 1)
          first_combo = "await combo();\nassert.equal(await page.evaluate(() => window.__legatoOwner.state.zone), 3, 'LB+RB should enter the score');"
          first_replacement = "const expectedReturnZone = await page.evaluate(() => {\n  const owner = window.__legatoOwner;\n  const selected = document.querySelector('[data-scan-selected=\\\"true\\\"]');\n  return selected ? owner.scanZoneForElement(selected) : owner.state.zone;\n});\n" + first_combo
          if first_combo not in t:
              raise SystemExit('Could not find first combo assertion')
          t = t.replace(first_combo, first_replacement, 1)
          t = t.replace("assert.equal(await page.evaluate(() => window.__legatoOwner.state.zone), 2, 'second LB+RB should leave the score');", "assert.equal(await page.evaluate(() => window.__legatoOwner.state.zone), expectedReturnZone, 'second LB+RB should leave to the prior interface focus');", 1)
          t = t.replace("assert.equal(await page.evaluate(() => window.__legatoOwner.state.zone), 2, 'LB+RB should return to the prior interface zone');", "assert.equal(await page.evaluate(() => window.__legatoOwner.state.zone), expectedReturnZone, 'LB+RB should return to the prior interface zone');", 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Run live bumper interaction checks
        id: browser
        continue-on-error: true
        run: |
          python3 -m http.server 4173 >/tmp/legato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          set +e
          node tools/test-bumper-score-toggle.mjs > tools/bumper-browser-result.txt 2>&1
          CODE=$?
          echo $CODE > tools/bumper-browser-exit.txt
          cat tools/bumper-browser-result.txt
          exit 0
      - name: Commit exact browser diagnostic when needed
        run: |
          if [ "$(cat tools/bumper-browser-exit.txt)" != "0" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/bumper-browser-result.txt tools/bumper-browser-exit.txt
            git commit -m "Capture bumper browser test failure" || true
            git push origin HEAD:fix/bumper-score-toggle
          fi
      - name: Stop on browser failure
        run: test "$(cat tools/bumper-browser-exit.txt)" = "0"
      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Toggle score editor with both bumpers"
          git push origin HEAD:fix/bumper-score-toggle

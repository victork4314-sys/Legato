name: Real DOM auto scan check
on:
  pull_request:
    paths:
      - .real-dom-scan-trigger
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: python .github/scripts/run_real_dom_scan_patch.py
      - name: Verify source and syntax
        run: |
          git diff --check
          git diff --name-only | grep -qx 'index.html'
          grep -q 'visibleScanItems()' index.html
          grep -q 'support.js?v=20260727-real-dom-scan-1' index.html
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script\b[^>]*\bdata-dc-script\b[^>]*>(.*?)</script>', text, re.S)
          if len(matches) != 1: raise SystemExit('script block mismatch')
          Path('/tmp/legato.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/legato.js
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Test every rendered control and activation
        run: |
          python -m http.server 4173 >/tmp/legato-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'JS'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.addInitScript(() => localStorage.setItem('legato.tour.v1', '1'));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => !!window.__legatoOwner, null, { timeout: 30000 });
            const result = await page.evaluate(async () => {
              const owner = window.__legatoOwner;
              const unique = new Set();
              const misses = [];
              const perMode = [];
              for (let mode = 0; mode < 6; mode++) {
                await new Promise(resolve => owner.setState({ mode, zone: 2, autoScan: true }, () => requestAnimationFrame(resolve)));
                const items = owner.visibleScanItems();
                perMode.push(items.length);
                for (let i = 0; i < items.length; i++) {
                  owner._domScanIndex = i;
                  owner.syncGlobalSelection();
                  const selected = Array.from(document.querySelectorAll('[data-scan-selected="true"]'));
                  if (selected.length !== 1) misses.push({ mode, i, selected: selected.length });
                  else {
                    const target = selected[0];
                    unique.add((target.getAttribute('data-ptr') || target.textContent.trim()) + '@' + mode);
                    if (target.closest('[data-scroll="score"]')) misses.push({ mode, i, score: true });
                    const style = getComputedStyle(target);
                    if (style.outlineStyle === 'none' || style.outlineWidth === '0px') misses.push({ mode, i, outline: false });
                  }
                }
              }
              await new Promise(resolve => owner.setState({ mode: 1, zone: 2, autoScan: true }, () => requestAnimationFrame(resolve)));
              const setup = Array.from(document.querySelectorAll('[data-ptr]')).find(el => el.offsetParent !== null && /setup mode/i.test(el.getAttribute('data-ptr') || ''));
              let activated = false;
              if (setup) {
                document.querySelectorAll('[data-scan-selected="true"]').forEach(el => el.removeAttribute('data-scan-selected'));
                setup.setAttribute('data-scan-selected', 'true');
                owner.activateFocus();
                await new Promise(resolve => requestAnimationFrame(resolve));
                activated = owner.state.mode === 0;
              }
              return { unique: unique.size, misses, perMode, activated };
            });
            assert(result.perMode.every(n => n > 20), 'too few visible controls in a mode: ' + JSON.stringify(result.perMode));
            assert(result.unique > 100, 'not enough controls covered: ' + result.unique);
            assert(result.misses.length === 0, 'selection failures: ' + JSON.stringify(result.misses.slice(0, 10)));
            assert(result.activated, 'A/activateFocus did not activate the outlined DOM item');
            assert(errors.length === 0, 'page errors: ' + errors.join(' | '));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          JS
      - name: Commit verified app change
        run: |
          git config user.name "Legato maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Scan and select every rendered control"
          git push origin HEAD:${{ github.head_ref }}

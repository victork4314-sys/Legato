name: Audit SMuFL playback classifications
on:
  pull_request:
    branches: [main]
    paths:
      - smufl-catalog.js
      - .github/workflows/audit-smufl-semantics.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-smufl-library-playback-selector
      - name: Audit every generated classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections, json, re

          raw = Path('smufl-catalog.js').read_text(encoding='utf-8')
          prefix = 'window.LEGATO_SMUFL_CATALOG='
          data = json.loads(raw[len(prefix):].strip()[:-1])
          glyphs = data['glyphs']

          sound_words = re.compile(r'(pizz|arco|mute|sordin|harmonic|tremolo|trill|mordent|turn|shake|grace|acciacc|appoggi|fermata|breath|caesura|gliss|portamento|scoop|fall|doit|plop|rip|smear|bend|slide|pedal|octave|ottava|vibrato|flutter|growl|slap|tongue|air sound|bow|stacc|tenuto|accent|marcato|portato|dynamic|crescendo|diminuendo|hairpin|timpani|drum|cymbal|gong|bell|triangle|woodblock|agogo|tambourine|whistle|snap)', re.I)
          visual_words = re.compile(r'(parenthes|bracket|combining|component|stem|flag|text |control|begin |end |left$|right$|arrow|placeholder|space|repeat dot|augmentation dot|staff line|ledger|beam)', re.I)
          false_silence = []
          false_sound = []
          for g in glyphs:
              text = ' '.join(str(g.get(k,'')) for k in ('id','label','range'))
              semantic_text = ' '.join(str(g.get(k,'')) for k in ('id','label'))
              if not g.get('audible') and sound_words.search(text) and not visual_words.search(semantic_text):
                  false_silence.append({k:g.get(k) for k in ('id','label','range','group','placement','kind','audible','sound')})
              if g.get('audible') and (str(g.get('id','')).startswith(('control','text')) or visual_words.search(semantic_text)):
                  false_sound.append({k:g.get(k) for k in ('id','label','range','group','placement','kind','audible','sound','pattern','technique')})

          report = {
              'glyphCount': len(glyphs),
              'audibleCount': sum(bool(g.get('audible')) for g in glyphs),
              'silentCount': sum(not g.get('audible') for g in glyphs),
              'kindCounts': collections.Counter(g.get('kind') for g in glyphs),
              'soundCounts': collections.Counter(g.get('sound') for g in glyphs if g.get('audible')),
              'falseSilenceCount': len(false_silence),
              'falseSoundCount': len(false_sound),
              'falseSilence': false_silence[:400],
              'falseSound': false_sound[:400],
          }
          Path('tools').mkdir(exist_ok=True)
          Path('tools/smufl-semantic-audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, default=dict), encoding='utf-8')
          print(json.dumps({k:report[k] for k in ('glyphCount','audibleCount','silentCount','falseSilenceCount','falseSoundCount')}, indent=2))
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/smufl-semantic-audit.json
          git diff --cached --quiet || git commit -m "Record full SMuFL semantic audit"
          git push origin HEAD:feature/complete-smufl-library-playback-selector

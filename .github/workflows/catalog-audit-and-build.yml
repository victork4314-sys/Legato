name: Catalog audit and build manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide whether the pinned browser engine must be built
        id: speech_engine
        shell: bash
        run: |
          set -euo pipefail
          if test -s vendor/whisper-command/command.js \
            && test -s vendor/whisper-command/helpers.js \
            && test -s vendor/whisper-command/build.json \
            && test -s coi-serviceworker.js; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the pinned on-device browser engine
        if: steps.speech_engine.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source whisper-build.lock

          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "$emscripten_version"
          /tmp/emsdk/emsdk activate "$emscripten_version"
          source /tmp/emsdk/emsdk_env.sh

          git clone --depth 1 --branch "$whisper_cpp_tag" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          git -C /tmp/whisper.cpp rev-parse HEAD > /tmp/whisper-commit.txt

          emcmake cmake -S /tmp/whisper.cpp -B /tmp/whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_WASM_SINGLE_FILE=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/whisper-build --target "$build_target" --parallel 2

          command_js=/tmp/whisper-build/bin/libcommand.js
          helpers_js=/tmp/whisper.cpp/examples/command.wasm/helpers.js
          coi_js=/tmp/whisper.cpp/examples/coi-serviceworker.js
          worker_js=/tmp/whisper-build/bin/libcommand.worker.js

          echo "Generated command engine files:"
          find /tmp/whisper-build/bin -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "Selected command_js=$command_js"
          echo "Selected helpers_js=$helpers_js"
          echo "Selected coi_js=$coi_js"

          test -s "$command_js"
          test -s "$helpers_js"
          test -s "$coi_js"

          rm -rf vendor/whisper-command
          mkdir -p vendor/whisper-command
          cp "$command_js" vendor/whisper-command/command.js
          cp "$helpers_js" vendor/whisper-command/helpers.js
          cp "$coi_js" coi-serviceworker.js
          if test -s "$worker_js"; then
            cp "$worker_js" vendor/whisper-command/libcommand.worker.js
          fi

          node --check vendor/whisper-command/command.js
          node --check vendor/whisper-command/helpers.js
          node --check coi-serviceworker.js
          grep -q "get_transcribed" vendor/whisper-command/command.js
          grep -q "set_audio" vendor/whisper-command/command.js
          grep -q "set_status" vendor/whisper-command/command.js
          grep -q "get_status" vendor/whisper-command/command.js
          test "$(wc -c < vendor/whisper-command/command.js)" -gt 1000000

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pins = dict(
              line.split('=', 1)
              for line in Path('whisper-build.lock').read_text().splitlines()
              if '=' in line
          )
          files = {}
          for path in sorted(Path('vendor/whisper-command').glob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  files[str(path)] = {
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  }
          sw = Path('coi-serviceworker.js').read_bytes()
          files['coi-serviceworker.js'] = {
              'bytes': len(sw),
              'sha256': hashlib.sha256(sw).hexdigest(),
          }
          Path('vendor/whisper-command/build.json').write_text(
              json.dumps(
                  {
                      'whisperCppTag': pins['whisper_cpp_tag'],
                      'whisperCppCommit': Path('/tmp/whisper-commit.txt').read_text().strip(),
                      'emscripten': pins['emscripten_version'],
                      'buildTarget': pins['build_target'],
                      'execution': pins['execution'],
                      'model': pins['model'],
                      'modelSha256': pins['model_sha256'],
                      'files': files,
                  },
                  indent=2,
              ) + '\n'
          )
          PY

      - name: Commit the generated engine to this feature branch
        if: github.event_name == 'pull_request' && steps.speech_engine.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whisper-command coi-serviceworker.js
          git commit -m "Build pinned on-device whisper command engine"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify the generated engine manifest and files
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/whisper-command/command.js
          test -s vendor/whisper-command/helpers.js
          test -s vendor/whisper-command/build.json
          test -s coi-serviceworker.js
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          build = json.loads(Path('vendor/whisper-command/build.json').read_text())
          pins = dict(
              line.split('=', 1)
              for line in Path('whisper-build.lock').read_text().splitlines()
              if '=' in line
          )
          assert build['whisperCppTag'] == pins['whisper_cpp_tag']
          assert build['emscripten'] == pins['emscripten_version']
          assert build['buildTarget'] == pins['build_target']
          assert build['execution'] == pins['execution']
          assert build['model'] == pins['model']
          assert build['modelSha256'] == pins['model_sha256']
          for name, expected in build['files'].items():
              data = Path(name).read_bytes()
              assert len(data) == expected['bytes'], name
              assert hashlib.sha256(data).hexdigest() == expected['sha256'], name
          PY

      - name: Check every runtime patch
        run: |
          node --check notation-placement-fix.js
          node --check notation-placement-priority-fix.js
          node --check notation-semantic-fix.js
          node --check notation-catalog-core.js
          node --check notation-catalog-metadata-corrections.js
          node --check notation-catalog-placement.js
          node --check notation-catalog-render-audio.js
          node --check notation-theory-playback-fix.js
          node --check musicxml-export-fix.js
          node --check legato-voice-language.js
          node --check legato-local-speech-engine.js
          node --check legato-voice-control.js
          node --check cache-refresh.js
          node --check vendor/whisper-command/command.js
          node --check vendor/whisper-command/helpers.js
          node --check coi-serviceworker.js
          node --check tests/catalog-audit.test.js
          node --check tests/run-catalog-audit.js
          node --check tests/musicxml-export.test.js
          node --check tests/voice-language.test.js
          node --check tests/voice-runtime.test.js
          node --check tests/local-speech-engine.test.js
          node --check tests/immediate-voice-control.test.js

      - name: Audit every catalog entry
        id: catalog_audit
        continue-on-error: true
        run: node tests/run-catalog-audit.js > catalog-audit-output.txt 2>&1
      - name: Audit Dorico MusicXML export
        id: musicxml_audit
        continue-on-error: true
        run: node tests/musicxml-export.test.js > musicxml-audit-output.txt 2>&1
      - name: Test voice language and safety
        id: voice_language
        continue-on-error: true
        run: node tests/voice-language.test.js > voice-language-output.txt 2>&1
      - name: Test voice execution against Legato methods
        id: voice_runtime
        continue-on-error: true
        run: node tests/voice-runtime.test.js > voice-runtime-output.txt 2>&1
      - name: Test on-device microphone engine
        id: voice_local
        continue-on-error: true
        run: node tests/local-speech-engine.test.js > voice-local-output.txt 2>&1
      - name: Test direct command execution
        id: voice_immediate
        continue-on-error: true
        run: node tests/immediate-voice-control.test.js > voice-immediate-output.txt 2>&1

      - name: Upload catalog audit output
        if: always() && steps.catalog_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-output
          path: catalog-audit-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload MusicXML audit output
        if: always() && steps.musicxml_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-audit-output
          path: musicxml-audit-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload voice test output
        if: always() && steps.voice_language.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: voice-control-test-output
          path: |
            voice-language-output.txt
            voice-runtime-output.txt
            voice-local-output.txt
            voice-immediate-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when an exhaustive audit fails
        if: steps.catalog_audit.outcome != 'success' || steps.musicxml_audit.outcome != 'success' || steps.voice_language.outcome != 'success' || steps.voice_runtime.outcome != 'success' || steps.voice_local.outcome != 'success' || steps.voice_immediate.outcome != 'success'
        run: |
          cat catalog-audit-output.txt
          cat musicxml-audit-output.txt
          cat voice-language-output.txt
          cat voice-runtime-output.txt
          cat voice-local-output.txt
          cat voice-immediate-output.txt
          exit 1

      - name: Publish the tested build manifest
        if: github.event_name == 'push' && steps.catalog_audit.outcome == 'success' && steps.musicxml_audit.outcome == 'success' && steps.voice_language.outcome == 'success' && steps.voice_runtime.outcome == 'success' && steps.voice_local.outcome == 'success' && steps.voice_immediate.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          engine = json.loads(Path('vendor/whisper-command/build.json').read_text())
          Path('legato-build.json').write_text(
              json.dumps(
                  {
                      'version': os.environ['GITHUB_SHA'],
                      'audited': True,
                      'catalogEntries': 3451,
                      'voiceLanguageTests': 64,
                      'voiceRuntimeTests': 19,
                      'localSpeechEngineTests': 12,
                      'immediateVoiceExecutionTests': 9,
                      'voiceExecution': 'immediate',
                      'onDeviceSpeechEngine': {
                          'whisperCppTag': engine['whisperCppTag'],
                          'whisperCppCommit': engine['whisperCppCommit'],
                          'emscripten': engine['emscripten'],
                          'model': engine['model'],
                          'modelSha256': engine['modelSha256'],
                      },
                  },
                  indent=2,
              ) + '\n'
          )
          PY
      - name: Commit the tested manifest when needed
        if: github.event_name == 'push' && steps.catalog_audit.outcome == 'success' && steps.musicxml_audit.outcome == 'success' && steps.voice_language.outcome == 'success' && steps.voice_runtime.outcome == 'success' && steps.voice_local.outcome == 'success' && steps.voice_immediate.outcome == 'success'
        run: |
          if git diff --quiet -- legato-build.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legato-build.json
          git commit -m "Publish audited Legato build ${GITHUB_SHA::12}"
          git push origin HEAD:main

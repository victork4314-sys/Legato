name: Catalog audit and build manifest

on:
  push:
    branches: [main]
    paths:
      - "notation-catalog-*.js"
      - "notation-placement-*.js"
      - "notation-semantic-fix.js"
      - "notation-theory-playback-fix.js"
      - "cache-refresh.js"
      - "smufl-catalog.js"
      - "tests/catalog-audit.test.js"
      - ".github/workflows/catalog-audit-and-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "notation-catalog-*.js"
      - "notation-placement-*.js"
      - "notation-semantic-fix.js"
      - "notation-theory-playback-fix.js"
      - "cache-refresh.js"
      - "smufl-catalog.js"
      - "tests/catalog-audit.test.js"
      - ".github/workflows/catalog-audit-and-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check every runtime patch
        run: |
          node --check notation-placement-fix.js
          node --check notation-placement-priority-fix.js
          node --check notation-semantic-fix.js
          node --check notation-catalog-core.js
          node --check notation-catalog-placement.js
          node --check notation-catalog-render-audio.js
          node --check notation-theory-playback-fix.js
          node --check cache-refresh.js
          node --check tests/catalog-audit.test.js
      - name: Audit every catalog entry
        id: catalog_audit
        continue-on-error: true
        run: node tests/catalog-audit.test.js > catalog-audit-output.txt 2>&1
      - name: Upload catalog audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-output
          path: catalog-audit-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail when the exhaustive audit fails
        if: steps.catalog_audit.outcome != 'success'
        run: |
          cat catalog-audit-output.txt
          exit 1
      - name: Publish the tested build manifest
        if: github.event_name == 'push' && steps.catalog_audit.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("legato-build.json").write_text(
              json.dumps(
                  {
                      "version": os.environ["GITHUB_SHA"],
                      "audited": True,
                      "catalogEntries": 3451,
                  },
                  indent=2,
              ) + "\n"
          )
          PY
      - name: Commit the tested manifest when needed
        if: github.event_name == 'push' && steps.catalog_audit.outcome == 'success'
        run: |
          if git diff --quiet -- legato-build.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legato-build.json
          git commit -m "Publish audited Legato build ${GITHUB_SHA::12}"
          git push origin HEAD:main
